<form autocomplete="off" novalidate="novalidate" class="or clearfix pages" dir="ltr" data-form-id="YAA_FormX_SkinConditions">
<section class="form-logo"></section><h3 dir="auto" id="form-title">Youth Skin Conditions</h3>

      </section><section class="or-group " name="/data/inputs/contact"><h4><span lang="" class="question-label active">NO_LABEL</span></h4>

<section class="or-group " name="/data/inputs/contact/parent/parent"><h4><span lang="" class="question-label active">NO_LABEL</span></h4>

    <section class="or-group or-appearance-field-list " name="/data/skin_conditions_group"><h4><span lang="" class="question-label active">Skin conditions</span></h4>
<fieldset class="question simple-select "><fieldset>
<legend>
<span lang="" class="question-label active">Skin symptoms to look and ask for.</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('skin_symptoms')/root/item"><input type="checkbox" name="/data/skin_conditions_group/skin_symptoms" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset></fieldset>
<fieldset class="question simple-select "><fieldset>
<legend>
<span lang="" class="question-label active">Does the skin appear pale or light?</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('yes_no')/root/item"><input type="radio" name="/data/skin_conditions_group/skin_appearance_pale" data-name="/data/skin_conditions_group/skin_appearance_pale" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset></fieldset>
<fieldset class="question simple-select "><fieldset>
<legend>
<span lang="" class="question-label active">Does the sclera appear abnormal, or tinted a strange color?</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('yes_no')/root/item"><input type="radio" name="/data/skin_conditions_group/sclera_appearance_abnormal" data-name="/data/skin_conditions_group/sclera_appearance_abnormal" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset></fieldset>

    <section class="or-group or-appearance-field-list or-appearance-summary " name="/data/results_group"><h4><span lang="" class="question-label active">Results</span></h4>
<label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Impetigo or Folliculitis</span><input type="text" name="/data/results_group/res_impetigo" data-relevant=" /data/results_group/calc_impetigo  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The youth may have impetigo or folliculitis. Clean sores with antiseptic. Drain pus if fluctuant. Start cloxacillin tablets if &gt;4cm or red streaks or tender nodes or multiple abscesses for 5 days (Apply antibiotic cream – triple antibiotic ointment).</span><input type="text" name="/data/results_group/res_impetigo_action" data-relevant=" /data/results_group/calc_impetigo  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Ring Worm (Tinea)</span><input type="text" name="/data/results_group/res_ring_worm" data-relevant=" /data/results_group/calc_ring_worm  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The youth may have ring worm. If limited to a few patches: Grisefulvine or Ketoconazole cream. If extensive give: griseofulvin tablets, 125 mg with fatty meal (10mg/kg/day), 2 tablets once a day for 6 weeks. If in hair: shave hair, treat as above. If infected (red, warm, pus) add cloxacilline.</span><input type="text" name="/data/results_group/res_ring_worm_action" data-relevant=" /data/results_group/calc_ring_worm  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Scabies</span><input type="text" name="/data/results_group/res_scabies" data-relevant=" /data/results_group/calc_scabies  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The youth may have scabies. Treat itching: Calamine lotion. Apply: 25% topical Benzyl Benzoate at night, repeat for 3 days after washing. Council hygiene measures: treat all people in the household who are affected, wash bed linen and clothes with warm water and put in the sun, wash affected persons. When infected add cloxaciline.</span><input type="text" name="/data/results_group/res_scabies_action" data-relevant=" /data/results_group/calc_scabies  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Moderate Anemia</span><input type="text" name="/data/results_group/res_anemia" data-relevant=" /data/results_group/calc_anemia  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The youth may have moderate anemia. Iron, folic acid – 1 tablet once a day, give for 14 days. Albendazole (400 mg) 1 tablet. Nutrition counseling: green leaves (panzou, lyann panye, moringa, boujon pwa, boujon manyok), fruits, rasped carots and red beet.</span><input type="text" name="/data/results_group/res_anemia_action" data-relevant=" /data/results_group/calc_anemia  = 'true'" data-type-xml="string" readonly></label>
      </section>

<label class="calculation non-select "><input type="hidden" name="/data/source" data-calculate="../inputs/source" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/source_id" data-calculate="../inputs/source_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_uuid" data-calculate="../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_id" data-calculate="../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_name" data-calculate="../inputs/contact/name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_short_name" data-calculate="../inputs/contact/short_name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_sex" data-calculate="../inputs/contact/sex" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_date_of_birth" data-calculate="../inputs/contact/date_of_birth" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_years" data-calculate="floor( difference-in-months(  /data/client_date_of_birth , today() ) div 12 )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_months" data-calculate="difference-in-months(  /data/client_date_of_birth , today() )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_days" data-calculate="floor( decimal-date-time(today()) - decimal-date-time( /data/client_date_of_birth ) )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_weeks" data-calculate="floor((decimal-date-time(today()) - decimal-date-time( /data/client_date_of_birth )) div 7)" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_impetigo" data-calculate="if(selected( /data/skin_conditions_group/skin_symptoms , 'crusts_lesions') or selected( /data/skin_conditions_group/skin_symptoms , 'blisters_sores'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_ring_worm" data-calculate="if(selected( /data/skin_conditions_group/skin_symptoms , 'itchy_circular'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_scabies" data-calculate="if(selected( /data/skin_conditions_group/skin_symptoms , 'rash_torso') and selected( /data/skin_conditions_group/skin_symptoms , 'rash_web') and selected( /data/skin_conditions_group/skin_symptoms , 'face_spared'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_anemia" data-calculate="if( /data/skin_conditions_group/skin_appearance_pale  = 'yes' or  /data/skin_conditions_group/sclera_appearance_abnormal  = 'yes', 'true', 'false')" data-type-xml="string"></label>
</fieldset>
</form>
