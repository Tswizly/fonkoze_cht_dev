<label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Tuberculosis</span><input type="text" name="/data/results_group/res_tuberculosis" data-relevant=" /data/results_group/calc_tuberculosis  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient may have Tuberculosis.</p>Procedure:<ul><li>Refer for diagnosis and treatment</li><li>Really motivate for referal (free treatment!)</li></ul></span><input type="text" name="/data/results_group/res_tuberculosis_action" data-relevant=" /data/results_group/calc_tuberculosis  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Asthma</span><input type="text" name="/data/results_group/res_asthma" data-relevant=" /data/results_group/calc_asthma  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient may have Asthma.</p>Procedure:<ul><li>Nebulizer for immediate treatment</li><li>Dexamethasone IM 8 mg</li><li>Send home with: Salbutamol tablet 4mg – 2 times day during one week</li><li>If condition does not improve after two days, go to the hospital</li></ul></span><input type="text" name="/data/results_group/res_asthma_action" data-relevant=" /data/results_group/calc_asthma  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Pneumonia</span><input type="text" name="/data/results_group/res_pneumonia" data-relevant=" /data/results_group/calc_pneumonia  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient may have Pneumonia.</p>Procedure:<ul><li>Azythromycine tablets 500 mg – 1 co per day for 5 days</li><li>Go to the hospital if no improvement after two days</li></ul></span><input type="text" name="/data/results_group/res_pneumonia_action" data-relevant=" /data/results_group/calc_pneumonia  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Risk of cardiac decompensation</span><input type="text" name="/data/results_group/res_cardiac_decompensation_risk" data-relevant=" /data/results_group/calc_cardiac_decompensation_risk  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient is at risk of cardiac decompensation.</p>Procedure:<ul><li>Refer</li></ul></span><input type="text" name="/data/results_group/res_cardiac_decompensation_risk_action" data-relevant=" /data/results_group/calc_cardiac_decompensation_risk  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Decompensation cardiaque</span><input type="text" name="/data/results_group/res_cardiac_decompensation" data-relevant=" /data/results_group/calc_cardiac_decompensation  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient may have decompensation cardiaque.</p>Procedure:<ul><li>Refer to hospital</li></ul></span><input type="text" name="/data/results_group/res_cardiac_decompensation_action" data-relevant=" /data/results_group/calc_cardiac_decompensation  = 'true'" data-type-xml="string" readonly></label>

ta-calculate="floor((decimal-date-time(today()) - decimal-date-time( /data/client_date_of_birth )) div 7)" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_tuberculosis" data-calculate="if(selected( /data/respiratory_conditions_group/respiratory_symptoms , 'cough_greater_2_weeks') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'weight_loss') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'night_sweats'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_asthma" data-calculate="if(selected( /data/respiratory_conditions_group/respiratory_symptoms , 'wheezing') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'respiratory_distress') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'recurring_condition'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_pneumonia" data-calculate="if(selected( /data/respiratory_conditions_group/respiratory_symptoms , 'fever_over_38_greater_1_week') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'cough') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'respiratory_distress'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_cardiac_decompensation_risk" data-calculate="if(selected( /data/respiratory_conditions_group/respiratory_symptoms , 'jugular_venous_distention') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'oedema_feet_ankles') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'respiratory_distress_after_exercise'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_cardiac_decompensation" data-calculate="if(selected( /data/respiratory_conditions_group/respiratory_symptoms , 'tiredness') or selected( /data/respiratory_conditions_group/respiratory_symptoms , 'symptoms_ongoing_several_weeks'), 'true', 'false')" data-type-xml="string"></label>
