    <section class="or-group or-appearance-field-list " name="/data/skin_checkup_group"><h4><span lang="" class="question-label active">Skin Checkup</span></h4>
<fieldset class="question simple-select ">
<fieldset>
<legend>
<span lang="" class="question-label active">Skin symptoms to look and ask for.</span><span class="required">*</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('skin_symptoms')/root/item"><input type="checkbox" name="/data/skin_checkup_group/skin_symptoms" data-required="true()" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset>

</fieldset>

<fieldset>

          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('malnutrition_anemia_symptoms')/root/item"><input type="checkbox" name="/data/skin_checkup_group/malnutrition_anemia_symptoms" data-required="true()" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>

    <section class="or-group or-appearance-field-list or-appearance-summary " name="/data/results_group"><h4><span lang="" class="question-label active">Results</span></h4>
<label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Impetigo or Folliculitis</span><input type="text" name="/data/results_group/res_impetigo" data-relevant=" /data/results_group/calc_impetigo  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The child may have Impetigo or Folliculitis.\n\nProcedure:\n- Clean sores with antiseptic\n- Drain pus if fluctuant\n- Start cloxacillin sirup (125mg/5ml) if size &gt;4cm or red streaks or tender nodes or multiple abscesses for 5 days (50mg/kg every 6 hours)\n- Refer URGENTLY if child has fever and / or if infection extends to the muscle\n- Apply antibiotic cream – triple antibiotic ointment</span><input type="text" name="/data/results_group/res_impetigo_action" data-relevant=" /data/results_group/calc_impetigo  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Ring Worm (Tinea)</span><input type="text" name="/data/results_group/res_ring_worm" data-relevant=" /data/results_group/calc_ring_worm  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The child may have Ring Worm.\n\nProcedure:\n- If limited to a few patches: Grisefulvine or Ketoconazole cream\n- If extensive give: Ketoconazole 2-12month(6-10kg): 40mg/day 12mo-5yrs: 60 mg/day Or if: Age &gt;2: give griseofulvin, tablets, 125 mg with fatty meal (10mg/kg/day), 2 tablets once a day for 6 weeks\n- If in hair: shave hair, treat as above\n- If infected (red, warm, pus) add cloxacilline</span><input type="text" name="/data/results_group/res_ring_worm_action" data-relevant=" /data/results_group/calc_ring_worm  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Scabies</span><input type="text" name="/data/results_group/res_scabies" data-relevant=" /data/results_group/calc_scabies  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The child may have Scabies.\n\nProcedure:\n- Treat itching: Calamine lotion\n- Apply: 25% topical Benzyl Benzoate at night, repeat for 3 days after washing.\n- Council hygiene measures: treat all people in the household who are affected, wash bed linen and clothes with warm water and put in the sun, wash affected persons\n- When infected add cloxaciline</span><input type="text" name="/data/results_group/res_scabies_action" data-relevant=" /data/results_group/calc_scabies  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Moderate or Severe Acute Malnutrition with Anemia</span><input type="text" name="/data/results_group/res_severe_malnutrition_anemia" data-relevant=" /data/results_group/calc_severe_malnutrition_anemia  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The child may have moderate or severe acute malnutrition with anemia.\n\nProcedure:\n- Refer to malnutrition clinic\n- Iron-Folic Acid tablets – 1 per day</span><input type="text" name="/data/results_group/res_severe_malnutrition_anemia_action" data-relevant=" /data/results_group/calc_severe_malnutrition_anemia  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Severe Anemia</span><input type="text" name="/data/results_group/res_severe_anemia" data-relevant=" /data/results_group/calc_severe_anemia  = 'true' and  /data/results_group/calc_severe_malnutrition_anemia  != 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The child may have severe anemia.\n\nProcedure:\n- Iron folic acid\n- Refer for investigation</span><input type="text" name="/data/results_group/res_severe_anemia_action" data-relevant=" /data/results_group/calc_severe_anemia  = 'true' and  /data/results_group/calc_severe_malnutrition_anemia  != 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-yellow "><span lang="" class="question-label active">Moderate Anemia</span><input type="text" name="/data/results_group/res_moderate_anemia" data-relevant=" /data/results_group/calc_moderate_anemia  = 'true' and  /data/results_group/calc_severe_anemia  != 'true' and  /data/results_group/calc_severe_malnutrition_anemia  != 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">The child may have moderate anemia.\n\nProcedure:\n- Iron, folic acid – 1 tablet once a day, give for 14 days\n- Albendazole (400 mg) 12-23 months – ½ co every 6 months 24-59 months – 1 co every 6 months\n- Nutrition counseling: green leaves, fruits, rasped carots and red beet</span><input type="text" name="/data/results_group/res_moderate_anemia_action" data-relevant=" /data/results_group/calc_moderate_anemia  = 'true' and  /data/results_group/calc_severe_anemia  != 'true' and  /data/results_group/calc_severe_malnutrition_anemia  != 'true'" data-type-xml="string" readonly></label>
      </section>

ta-calculate="floor((decimal-date-time(today()) - decimal-date-time( /data/client_date_of_birth )) div 7)" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_impetigo" data-calculate="if(selected( /data/skin_checkup_group/skin_symptoms , 'crusts_lesions') or selected( /data/skin_checkup_group/skin_symptoms , 'blisters_sores_pustules'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_ring_worm" data-calculate="if(selected( /data/skin_checkup_group/skin_symptoms , 'itchy_lesions'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_scabies" data-calculate="if(selected( /data/skin_checkup_group/skin_symptoms , 'rash') and selected( /data/skin_checkup_group/skin_symptoms , 'web_space_wrists') and selected( /data/skin_checkup_group/skin_symptoms , 'face_spared'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_severe_malnutrition_anemia" data-calculate="if(selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'lethargy') or selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'oedema') or selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'respiratory_distress') or selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'muac_yellow_red'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_severe_anemia" data-calculate="if((selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'lethargy') or selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'oedema') or selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'respiratory_distress')) and selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'muac_green'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_moderate_anemia" data-calculate="if(selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'pale_complexion') or selected( /data/skin_checkup_group/malnutrition_anemia_symptoms , 'sclera_abnormal'), 'true', 'false')" data-type-xml="string"></label>
</fieldset>
