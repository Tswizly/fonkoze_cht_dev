<form autocomplete="off" novalidate="novalidate" class="or clearfix pages" dir="ltr" data-form-id="ADT_FormX_Hypertension">

    <section class="or-group or-appearance-field-list " name="/data/form_purpose_group"><h4><span lang="" class="question-label active">Form purpose</span></h4>

    <section class="or-group or-branch pre-init or-appearance-field-list " name="/data/hypertension_assessment_group" data-relevant=" /data/form_purpose_group/form_purpose  = 'perform_followup'"><h4><span lang="" class="question-label active">Hypertension Assessment</span></h4>
<fieldset class="question simple-select "><fieldset>
<legend>
<span lang="" class="question-label active">Danger signs</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('danger_signs')/root/item"><input type="checkbox" name="/data/hypertension_assessment_group/danger_signs" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset></fieldset>
<label class="question non-select "><span lang="" class="question-label active">Systolic blood pressure:</span><span class="required">*</span><input type="number" name="/data/hypertension_assessment_group/bp_systolic" data-required="true()" data-constraint=". &lt;= 999" data-type-xml="int"><span class="or-constraint-msg active" lang="" data-i18n="constraint.invalid">Value not allowed</span><span class="or-required-msg active" lang="" data-i18n="constraint.required">This field is required</span></label><label class="question non-select "><span lang="" class="question-label active">Diastolic blood pressure:</span><span class="required">*</span><input type="number" name="/data/hypertension_assessment_group/bp_diastolic" data-required="true()" data-constraint=". &lt;= 999" data-type-xml="int"><span class="or-constraint-msg active" lang="" data-i18n="constraint.invalid">Value not allowed</span><span class="or-required-msg active" lang="" data-i18n="constraint.required">This field is required</span></label><fieldset class="question simple-select "><fieldset>
<legend>
<span lang="" class="question-label active">Does BP need to be remeasured?</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('yes_no')/root/item"><input type="radio" name="/data/hypertension_assessment_group/bp_remeasure" data-name="/data/hypertension_assessment_group/bp_remeasure" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset></fieldset>
<label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Systolic BP Remeasure</span><input type="number" name="/data/hypertension_assessment_group/bp_systolic_remeasure" data-constraint=". &lt;= 999" data-relevant=" /data/hypertension_assessment_group/bp_remeasure  = 'yes'" data-type-xml="int"><span class="or-constraint-msg active" lang="" data-i18n="constraint.invalid">Value not allowed</span></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Diastolic BP Remeasure</span><input type="number" name="/data/hypertension_assessment_group/bp_diastolic_remeasure" data-constraint=". &lt;= 999" data-relevant=" /data/hypertension_assessment_group/bp_remeasure  = 'yes'" data-type-xml="int"><span class="or-constraint-msg active" lang="" data-i18n="constraint.invalid">Value not allowed</span></label>
      </section>
    <section class="or-group or-appearance-field-list " name="/data/results_group"><h4><span lang="" class="question-label active">Results</span></h4>
<label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Hypertensive Urgency</span><input type="text" name="/data/results_group/res_hypertensive_urgency" data-relevant=" /data/results_group/calc_hypertensive_urgency  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient has hypertensive urgency.</p>Procedure:<ul><li>Nifedipine 10 mg Rapid Release under the tongue</li><li>Send home with treatment as follows</li></ul></span><input type="text" name="/data/results_group/res_hypertensive_urgency_action" data-relevant=" /data/results_group/calc_hypertensive_urgency  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Hypertension Grade 1</span><input type="text" name="/data/results_group/res_hypertension_grade_1" data-relevant=" /data/results_group/calc_hypertension_grade_1  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient has Grade 1 Hypertension.</p>Procedure:<ul><li>Hydrochlorotiazide 25 mg, every morning</li><li>Give for one month and ask to come back for control.</li><li>Counseling on danger signs: go to hospital if blurry vision, headache, neck stiffness, difficulty speaking.</li><li>Healthy diet: reduce salt, reduce fried food, eat more fruit and vegeatables.</li><li>Counseling on the need to never stop the medication</li></ul></span><input type="text" name="/data/results_group/res_hypertension_grade_1_action" data-relevant=" /data/results_group/calc_hypertension_grade_1  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Hypertension Grade 2</span><input type="text" name="/data/results_group/res_hypertension_grade_2" data-relevant=" /data/results_group/calc_hypertension_grade_2  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient has Grade 2 Hypertension.</p>Procedure:<ul><li>Hydrochlorothiazide 25 mg every morning</li><li>Enalapril 10 mg twice per day</li><li>Give for one month and ask to come back for control.</li><li>Counseling on danger signs and healthy diet.</li></ul></span><input type="text" name="/data/results_group/res_hypertension_grade_2_action" data-relevant=" /data/results_group/calc_hypertension_grade_2  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Hypertension Grade 3</span><input type="text" name="/data/results_group/res_hypertension_grade_3" data-relevant=" /data/results_group/calc_hypertension_grade_3  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient has Grade 3 Hypertension.</p>Procedure:<ul><li>Refer immediately</li></ul></span><input type="text" name="/data/results_group/res_hypertension_grade_3_action" data-relevant=" /data/results_group/calc_hypertension_grade_3  = 'true'" data-type-xml="string" readonly></label>
      </section>

<label class="calculation non-select "><input type="hidden" name="/data/source" data-calculate="../inputs/source" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/source_id" data-calculate="../inputs/source_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_uuid" data-calculate="../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_id" data-calculate="../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_name" data-calculate="../inputs/contact/name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_short_name" data-calculate="../inputs/contact/short_name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_sex" data-calculate="../inputs/contact/sex" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_date_of_birth" data-calculate="../inputs/contact/date_of_birth" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_years" data-calculate="floor( difference-in-months(  /data/client_date_of_birth , today() ) div 12 )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_months" data-calculate="difference-in-months(  /data/client_date_of_birth , today() )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_days" data-calculate="floor( decimal-date-time(today()) - decimal-date-time( /data/client_date_of_birth ) )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/client_age_in_weeks" data-calculate="floor((decimal-date-time(today()) - decimal-date-time( /data/client_date_of_birth )) div 7)" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/final_bp_systolic" data-calculate="if( /data/hypertension_assessment_group/bp_remeasure  = 'yes',  /data/hypertension_assessment_group/bp_systolic_remeasure ,  /data/hypertension_assessment_group/bp_systolic )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/final_bp_diastolic" data-calculate="if( /data/hypertension_assessment_group/bp_remeasure  = 'yes',  /data/hypertension_assessment_group/bp_diastolic_remeasure ,  /data/hypertension_assessment_group/bp_diastolic )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_hypertensive_urgency" data-calculate="if(selected( /data/hypertension_assessment_group/danger_signs , 'headache') or selected( /data/hypertension_assessment_group/danger_signs , 'neck_pain') or selected( /data/hypertension_assessment_group/danger_signs , 'neck_stiffness') or selected( /data/hypertension_assessment_group/danger_signs , 'vertigo') or selected( /data/hypertension_assessment_group/danger_signs , 'nausea') or selected( /data/hypertension_assessment_group/danger_signs , 'blurry_vision') or selected( /data/hypertension_assessment_group/danger_signs , 'difficulty_speaking') or selected( /data/hypertension_assessment_group/danger_signs , 'disoriented'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_hypertension_grade_3" data-calculate="if(( /data/results_group/final_bp_systolic  &gt; 180 or  /data/results_group/final_bp_diastolic  &gt; 110) and  /data/results_group/calc_hypertensive_urgency  != 'true', 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_hypertension_grade_2" data-calculate="if(( /data/results_group/final_bp_systolic  &gt; 150 or  /data/results_group/final_bp_diastolic  &gt; 100) and  /data/results_group/calc_hypertension_grade_3  != 'true' and  /data/results_group/calc_hypertensive_urgency  != 'true', 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_hypertension_grade_1" data-calculate="if(( /data/results_group/final_bp_systolic  &gt;= 140 or  /data/results_group/final_bp_diastolic  &gt;= 90) and  /data/results_group/calc_hypertension_grade_2  != 'true' and  /data/results_group/calc_hypertension_grade_3  != 'true' and  /data/results_group/calc_hypertensive_urgency  != 'true', 'true', 'false')" data-type-xml="string"></label>
</fieldset>
