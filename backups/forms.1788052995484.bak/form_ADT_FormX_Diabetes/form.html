<form autocomplete="off" novalidate="novalidate" class="or clearfix pages" dir="ltr" data-form-id="ADT_FormX_Diabetes">
<section class="form-logo"></section><h3 dir="auto" id="form-title">Diabetes</h3>
  
  
    <section class="or-group or-branch pre-init or-appearance-field-list " name="/data/inputs" data-relevant="./source = 'user'"><h4><span lang="" class="question-label active">NO_LABEL</span></h4>

<label class="question non-select or-appearance-select-contact or-appearance-type-person "><span lang="" class="question-label active">Contact ID</span><input type="text" name="/data/inputs/user/contact_id" data-type-xml="string"></label><section class="or-group " name="/data/inputs/user/parent"><h4><span lang="" class="question-label active">NO_LABEL</span></h4>
      </section>
      </section><section class="or-group " name="/data/inputs/contact"><h4><span lang="" class="question-label active">NO_LABEL</span></h4>
<label class="question non-select or-appearance-db-object "><span lang="" class="question-label active">What is the patient's name?</span><input type="text" name="/data/inputs/contact/_id" data-type-xml="person"></label><section class="or-group " name="/data/inputs/contact/parent"><h4><span lang="" class="question-label active">NO_LABEL</span></h4>
<section class="or-group " name="/data/inputs/contact/parent/parent"><h4><span lang="" class="question-label active">NO_LABEL</span></h4>

      </section>

      </section>
      </section>
    <section class="or-group or-appearance-field-list " name="/data/diabetes_checkup_group"><h4><span lang="" class="question-label active">Diabetes Checkup</span></h4>
<fieldset class="question simple-select "><fieldset>
<legend>
<span lang="" class="question-label active">Is the patient experiencing any of the following symptoms?</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('diabetes_symptoms')/root/item"><input type="checkbox" name="/data/diabetes_checkup_group/diabetes_symptoms" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset></fieldset>
<fieldset class="question simple-select ">
<fieldset>
<legend>
<span lang="" class="question-label active">Do any of the patient's relatives have diabetes?</span><span class="required">*</span>
          </legend>
<div class="option-wrapper">
<label class="itemset-template" data-items-path="instance('yes_no')/root/item"><input type="radio" name="/data/diabetes_checkup_group/hereditary_diabetes" data-name="/data/diabetes_checkup_group/hereditary_diabetes" data-required="true()" data-type-xml="string" value=""></label><span class="itemset-labels" data-value-ref="name" data-label-ref="label">
      </span>
</div>
</fieldset>
<span class="or-required-msg active" lang="" data-i18n="constraint.required">This field is required</span>
</fieldset>
<label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Blood glucose value measured by diabetes finger prick test (mg/dL):</span><span class="required">*</span><input type="number" name="/data/diabetes_checkup_group/blood_glucose" data-required="true()" data-constraint=". &lt;= 999" data-relevant="count-selected( /data/diabetes_checkup_group/diabetes_symptoms ) &gt; 0" data-type-xml="int"><span class="or-constraint-msg active" lang="" data-i18n="constraint.invalid">Value not allowed</span><span class="or-required-msg active" lang="" data-i18n="constraint.required">This field is required</span></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">When did the patient last eat?</span><span class="required">*</span><input type="datetime-local" name="/data/diabetes_checkup_group/time_of_last_meal" data-required="true()" data-constraint="decimal-date-time(.) &gt;= decimal-date-time(today()) - 3" data-relevant="count-selected( /data/diabetes_checkup_group/diabetes_symptoms ) &gt; 0" data-type-xml="dateTime"><span lang="" class="or-constraint-msg active">Cannot be more than 3 days prior to today.</span><span class="or-required-msg active" lang="" data-i18n="constraint.required">This field is required</span></label>
      </section>
    <section class="or-group or-appearance-field-list " name="/data/results_group"><h4><span lang="" class="question-label active">Results</span></h4>
<label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Hyperglycemia</span><input type="text" name="/data/results_group/res_hyperglycemia_mild" data-relevant=" /data/results_group/calc_hyperglycemia_mild  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient is hyperglycemic.</p>Protocol: <br>Counseling<br>-Explain that the blood sugar is higher than normal but is not dangerously high. <br><p>-If measurement was after a meal, request to come back to following kwen Sante Pam without having eaten for a repeat test to confirm diabetes or not</p>Advise the patient to:<br>-Eat regular meals and avoid skipping meals. <br>-Reduce foods and drinks with added sugar, including soft drinks, sweetened juices, candies, cakes, and pastries. <br>-Limit large portions of rice, bread, pasta, and other refined starches. <br>-Choose whole grains, beans, vegetables, and fresh fruit. <br>-Include lean protein (beans, fish, eggs, poultry) with meals. <br>-Avoid excessive fried and fatty foods</span><input type="text" name="/data/results_group/res_hyperglycemia_mild_action" data-relevant=" /data/results_group/calc_hyperglycemia_mild  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Diabetes - Hyperglycemia</span><input type="text" name="/data/results_group/res_hyperglycemia_moderate" data-relevant=" /data/results_group/calc_hyperglycemia_moderate  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient has diabetes.</p>Protocol:<br>-Metformin, newly diagnosed type 2 diabetes, 500 mg with breakfast during one week <br>-If well tolerated, 500 mg twice daily with meals and then back for blood glucose test,<br>-If glycaemic control remains inadequate after 1–2 weeks, <br>increase by 500 mg per week<br><p>Increase by 500 mg/day each week as tolerated</p>Maintenance<br>1,000 mg twice daily <br><p>(maximum 2 g/day)</p>Counseling – see above and leaflet</span><input type="text" name="/data/results_group/res_hyperglycemia_moderate_action" data-relevant=" /data/results_group/calc_hyperglycemia_moderate  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active">Diabetes - Hyperglycemia</span><input type="text" name="/data/results_group/res_hyperglycemia_severe" data-relevant=" /data/results_group/calc_hyperglycemia_severe  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The patient has diabetes and extreme hyperglycemia.</p>Protocol:<br>Refer</span><input type="text" name="/data/results_group/res_hyperglycemia_severe_action" data-relevant=" /data/results_group/calc_hyperglycemia_severe  = 'true'" data-type-xml="string" readonly></label>
      </section>
  
<fieldset id="or-preload-items" style="display:none;"><label class="calculation non-select "><input type="hidden" name="/data/meta/instanceID" data-preload="uid" data-preload-params="" data-type-xml="string"></label></fieldset>
<fieldset id="or-calculated-items" style="display:none;">
<label class="calculation non-select "><input type="hidden" name="/data/source" data-calculate="../inputs/source" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/source_id" data-calculate="../inputs/source_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_uuid" data-calculate="../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_id" data-calculate="../inputs/contact/_id" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_name" data-calculate="../inputs/contact/name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_short_name" data-calculate="../inputs/contact/short_name" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_sex" data-calculate="../inputs/contact/sex" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_date_of_birth" data-calculate="../inputs/contact/date_of_birth" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_age_in_years" data-calculate="floor( difference-in-months(  /data/patient_date_of_birth , today() ) div 12 )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_age_in_months" data-calculate="difference-in-months(  /data/patient_date_of_birth , today() )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_age_in_days" data-calculate="floor( decimal-date-time(today()) - decimal-date-time( /data/patient_date_of_birth ) )" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/patient_age_in_weeks" data-calculate="floor((decimal-date-time(today()) - decimal-date-time( /data/patient_date_of_birth )) div 7)" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_hyperglycemia_mild" data-calculate="if( /data/diabetes_checkup_group/blood_glucose  &gt;= 120 and  /data/diabetes_checkup_group/blood_glucose  &lt;= 200, 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_hyperglycemia_moderate" data-calculate="if( /data/diabetes_checkup_group/blood_glucose  &gt; 200 and  /data/diabetes_checkup_group/blood_glucose  &lt;= 400, 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_hyperglycemia_severe" data-calculate="if( /data/diabetes_checkup_group/blood_glucose  &gt; 400, 'true', 'false')" data-type-xml="string"></label>
</fieldset>
</form>
