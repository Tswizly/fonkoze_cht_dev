l="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Pre-Eclampsia</span><input type="text" name="/data/results_group/res_pre_eclampsia" data-relevant=" /data/results_group/calc_pre_eclampsia  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The woman may have pre-eclampsia. Administer Nifedipine and refer to the hospital immediately.</p>Procedure:<ul><li>Nifedipine 20mg</li><li>Immediately refer to hospital</li></ul></span><input type="text" name="/data/results_group/res_pre_eclampsia_action" data-relevant=" /data/results_group/calc_pre_eclampsia  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Genitourinary Infections</span><input type="text" name="/data/results_group/res_genitourinary_infections" data-relevant=" /data/results_group/calc_genitourinary_infections  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The woman may have a genitourinary infection.</p>Procedure:<ul><li>Hygiene counseling</li><li>Amoxicillin 500 mg, 3 times/day for 7 days</li></ul></span><input type="text" name="/data/results_group/res_genitourinary_infections_action" data-relevant=" /data/results_group/calc_genitourinary_infections  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Threatened Miscarriage</span><input type="text" name="/data/results_group/res_threatened_miscarriage_less20" data-relevant=" /data/results_group/calc_threatened_miscarriage_less20  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The woman is threatening miscarriage. Refer to the hospital immediately.</p>Procedure: <ul><li>Paracetamol 500 mg on the spot and immediate referral</li></ul></span><input type="text" name="/data/results_group/res_threatened_miscarriage_less20_action" data-relevant=" /data/results_group/calc_threatened_miscarriage_less20  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select or-appearance-h1 or-appearance-red "><span lang="" class="question-label active">Threatened Miscarriage</span><input type="text" name="/data/results_group/res_threatened_miscarriage_greater20" data-relevant=" /data/results_group/calc_threatened_miscarriage_greater20  = 'true'" data-type-xml="string" readonly></label><label class="question or-branch pre-init non-select "><span lang="" class="question-label active"><p>The woman is threatening miscarriage. Refer to the hospital immediately.</p>Procedure: <ul><li>Nifedipine 20mg</li><li>Paracetamol 500mg</li><li>Immediate referral</li></ul></span><input type="text" name="/data/results_group/res_threatened_miscarriage_greater20_action" data-relevant=" /data/results_group/calc_threatened_miscarriage_greater20  = 'true'" data-type-xml="string" readonly></label>

ame="/data/results_group/calc_genitourinary_infections" data-calculate="if(selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'burning_urination') or selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'vaginal_itching') or selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'vaginal_discharge') or selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'positive_white_bloodcell_strip_in_urine'), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_threatened_miscarriage_less20" data-calculate="if( /data/perform_followup_group/confirm_pregnancy_duration_approximation  &lt; 20 and (selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'bleeding') or selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'pain_general')), 'true', 'false')" data-type-xml="string"></label><label class="calculation non-select "><input type="hidden" name="/data/results_group/calc_threatened_miscarriage_greater20" data-calculate="if( /data/perform_followup_group/confirm_pregnancy_duration_approximation  &gt; 20 and (selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'bleeding') or selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'pain_general') or selected( /data/perform_followup_group/concerning_pregnancy_symptoms , 'contractions')), 'true', 'false')" data-type-xml="string"></label>
